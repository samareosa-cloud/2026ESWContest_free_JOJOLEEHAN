name: smart_cane_app
description: Smart cane navigation and safety app
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_blue_plus: 2.3.12
  flutter_map: 8.3.2
  flutter_tts: 4.2.5
  geolocator: 14.0.3
  http: 1.6.0
  latlong2: 0.10.1
  speech_to_text: 7.4.0
  flutter_compass: 0.8.1
  permission_handler: 12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
